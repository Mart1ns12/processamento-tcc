# Fase 1 (seção 5 da especificação). Janelas contadas em PREGÕES do calendário (datas com IBOV).
fase1:
  janelas: {d1: 1, m1: 21, m6: 126, a1: 252}
  volume_pregoes: 20
  volatilidade_retornos: 20
  beta_pregoes: 252
  beta_minimo: 120
  setor_minimo: 3
  setor_excluir: "empresa"  # "empresa" = tira todas as ações do mesmo CNPJ; "acao" = tira só a própria ação
  base_defasagem_max_pregoes: 5        # janela: a base (último valor até a data-alvo t−n) só vale se estiver no máximo N pregões antes da data-alvo; senão historico_insuficiente (seção 6, "Base velha")
  ipca_defasagem_max_meses: 2          # IPCA: último mês conhecido no máximo N meses antes do mês de t (1 = normal; 2 = início do mês); senão indisponivel
  retorno_suspeito_min: -0.75          # retorno diário (fechamento_ajustado, contra o último preço) abaixo disto = suspeito (erro da coleta; seção 6)
  retorno_suspeito_max: 1.0            # acima disto = suspeito (ex.: AZUL3 com 30.599.848 de 09/04 a 17/04/2026)
  retorno_suspeito_pregoes_nivel: 21   # P/L, P/VP e yield: empresa fora das medianas do setor se teve retorno suspeito nos últimos N pregões até t
# Fase 1: fundamentos e proventos (seções 5 e 6 da especificação; plano da etapa 4).
fundamentos:
  # bancos, seguradoras e holdings (subsetor do v1-cadastro): margens, EBITDA e endividamento = nao_se_aplica.
  # "Holdings Diversificadas" desde 24/10/2026 (ITSA4: receita de holding deu margem líquida de 215%).
  subsetores_financeiros: ["Intermediários Financeiros", "Previdência e Seguros", "Holdings Diversificadas"]
  meses_janela: 12              # yield e payout: data_com em (t − 12 meses, t]
  anos_payout: 5                # payout_por_ano: últimos N exercícios (DFP) entregues até t
  anos_historico_proventos: 5   # soma por ano: ano de t e os N − 1 anteriores
  pvp_minimo_plausivel: 0.05    # P/VP calculado abaixo disto = quantidade de ações suspeita (v1-acoes_emitidas em milhares em ~25 empresas; seção 10)
  balanco_idade_max_meses: 15   # balanço de referência com data_fim_periodo + N meses antes de t = velho: P/L, P/VP, ROE, margens, EBITDA, endividamento e payout 12m indisponíveis (seção 6)
# Fase 2: dataset do experimento (seção 7.3; plano da etapa 5). Volatilidade, volume, beta e
# setor_excluir vêm do bloco fase1 (mesma conta do painel).
experimento:
  retornos: {ret_1d: 1, ret_5d: 5, ret_20d: 20}
  exposicao_pregoes: 120
  exposicao_minimo: 60
  extremos_pregoes: 252
  extremos_minimo: 120
  mudanca_tom_pregoes: 30
  mudanca_tom_minimo: 5
  sem_horario_na_noite: true
  # "manha": janela = 08:00:01 de t até 08:00 do próximo pregão (dia + noite; usada porque ~89% das notícias só têm a data). "fechamento": só a noite (fechamento de t até 08:00), descartando pregão e pré-abertura — usar quando a coleta trouxer o horário real.
  inicio_janela: "manha"
  deduplicar_titulo: true
  principais:
    origens: ["cvm_ipe"]
    tipos_conteudo: ["reportagem"]
    papeis: ["protagonista", "citada_com_fato"]
# Fase 2: treino e avaliação (seções 7.4–7.7; plano da etapa 6). Com ~1 ano de histórico: SÓ TESTE DE FUNCIONAMENTO.
treino:
  semente: 20261023
  inicio_experimento: "cobertura"   # "cobertura" = cobertura_inicio do JSON do dataset (1ª data com notícias) ou "AAAA-MM-DD"
  treino_minimo_meses: 3            # meses de treino antes da 1ª dobra de teste
  embargo_pregoes: 1
  teste_final:
    inicio: "2026-06-23"            # 1º dia do teste final (o período reservado na v1 e nunca usado)
    fim: null                       # véspera da entrada em produção (etapa 8), "AAAA-MM-DD"; vazio = trava ativa. Depois: teste ao vivo
    liberado: false                 # true SÓ por decisão do usuário; mesmo assim exige --teste-final; uso único
  modelo_oficial: false            # true SÓ quando o histórico completo chegar e o desenvolvimento for refeito com ele (pegadinha 13)
  topk: [5, 3]                      # o primeiro é o corte principal
  xgboost: {n_estimators: 300, max_depth: 3, learning_rate: 0.03, subsample: 0.8, colsample_bytree: 0.8, min_child_weight: 50, reg_lambda: 5}
  grade: {max_depth: [2, 3], min_child_weight: [50, 200]}   # escolhida só nas dobras de desenvolvimento
  ganho_minimo_bloco: 0.005         # AUC médio por pregão; o bloco entra se o ganho passar disso
  logistica_c: 1.0
  acaso_sorteios: 10000
  bootstrap_reamostragens: 2000
  bootstrap_bloco_pregoes: 5
  motivos_qtd: 3
  motivos_limiar: 0.01              # |contribuição| (escala log-odds) até isto = "neutro"
  calibracao: {bins: 10, ece_maximo: 0.02, linhas_minimas: 5000, liberar_chance: false}
# Saída: pacotes JSON da seção 8 (plano da etapa 7). HORAS E CAMINHOS ENTRE ASPAS.
saida:
  limite_valido_historico: "10:00"          # top 5 gerado depois disso: valido_para_historico = false (seção 4)
  pasta: "saida"                            # saida/AAAA-MM-DD/ (fora do git)
  pasta_estado: "saida/estado"              # último envio dos pacotes "quando muda"
  pasta_registros: "registros/experimento"  # top 5 do dia e resultado (uso único; S11)
  tom_neutro: 0.05                          # |tom| até isto = "tom neutro" nos textos
  publicar_top_provisorio: false            # true = grava experimento_top e experimento_historico mesmo com treino.modelo_oficial false (seção 8.5)
  tolerancia_serie_relativa: 1.0e-6        # ponto antigo do series_diarias só conta como mudado acima disto (ruído float32 da coleta ~1e-7)
# Rotina diária (seção 4 da especificação; plano da etapa 8). HORAS E CAMINHOS ENTRE ASPAS.
rotina:
  inicio_consulta: "08:00"        # 1ª consulta ao painel da coleta (São Paulo)
  intervalo_minutos: 5            # entre consultas
  prazo: "09:45"                  # sem entrega até aqui: execucao "falhou", sem pacotes
  prazo_tardio: "12:00"           # continua consultando até aqui (rodada tardia); null = desliga
  etapas_conferidas: ["precos", "noticias", "enriquecimento"]   # não concluídas: aviso
  pasta_logs: "logs"
  trava: "saida/estado/rotina.trava"
  trava_validade_horas: 6
  aviso_calendario_dias: 30
  checagem:
    acoes_minimo_fracao: 0.9
    retorno_maximo_abs: 0.30
    preco_parado_pregoes: 5
    max_tickers_por_aviso: 10
