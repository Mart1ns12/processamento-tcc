# Horários da B3 (mercado à vista, sessão regular; fechamento = fim do call de fechamento).
# Fonte: B3 — horários de negociação do mercado à vista, ajustados ao horário de verão dos EUA
# (17h no horário de verão americano, 18h fora dele; troca na segunda-feira após a mudança nos EUA).
# Conferido pelo usuário na B3 (22/10/2026): em 2025 o horário mais cedo valeu a partir de
# 10/03/2025 e o normal voltou em 03/11/2025. A negociação contínua vai até 16:55/17:55 e o
# leilão de fechamento termina às 17h/18h — o "fechamento" aqui é o fim do leilão.
# Cada período vale de a_partir_de até o próximo.
# HORAS E DATAS ENTRE ASPAS.
fuso: "America/Sao_Paulo"
corte_noite: "08:00"            # fim da janela da noite (seção 7.2 da especificação)
horarios_b3_valido_ate: "2027-12-31"   # depois disso: erro, atualizar o arquivo
horarios_b3:
  # 2019-11-04 a 2024-03-10 (histórico novo, 24/10/2026): B3 OC 020/2022 (14/03/2022) e OC 125/2022 (07/11/2022);
  # os demais por notícias da época; o início em 2019-11-04 ainda a conferir.
