# Pedidos à coleta. Só o painel lê este arquivo (processamento/painel/pedidos.py).
# checagem = nome em pedidos.CHECAGENS; vazia = sem checagem automática.
# Datas entre aspas. Um pedido só vira "entregue" quando o diagnóstico confirma.

pedidos:
  - id: "google_news_2025"
    texto: "Google News de jan a jul/2025"
    detalhe: "Recarga de 2023 a 2025 aprovada; aguardando terminar"
    prioridade: "critico"
    checagem: "meses_sem_poucas_noticias"
    parametros: {de: "2025-01", ate: "2025-07"}

  - id: "finbert_juiza_cvm"
    texto: "FinBERT nos documentos novos da CVM"
    detalhe: "Notícias ainda sem probabilidade do FinBERT (a juíza fica no pedido juiza_historico)"
    prioridade: "normal"
    checagem: "finbert_e_juiza_completos"
    parametros: {max_aguardando: 0, so_finbert: true}

  - id: "acoes_sem_evento"
    texto: "Quantidades de ações sem evento correspondente"
    detalhe: "Desde 09/11/2026 (eventos depois da data_referencia): MGLU3 ref. 30/09/2020 (quantidade já depois do desdobramento 4 de 13/10/2020) e CNPJ 33376989000191 ref. 31/12/2022 (já depois do grupamento 30 antes da entrega de 21/03/2023)"
    prioridade: "normal"
    checagem: "acoes_coerentes_com_eventos"

  - id: "linha_sem_pregao"
    texto: "Linha em 20/11/2020 (sem pregão)"
    detalhe: "JBSS32 e NATU3"
    prioridade: "normal"
    checagem: "sem_linha_fora_do_calendario"
    parametros: {tickers: ["JBSS32", "NATU3"]}

  - id: "qtd_base_preco"
    texto: "Quantidade de ações na base do preço"
    detalhe: "Colunas qtd_*_base_atual e tabela de eventos"
    prioridade: "normal"
    checagem: "colunas_existem"
    parametros: {tabela: "v1-acoes_emitidas", colunas: ["qtd_on_base_atual", "qtd_pn_base_atual"], tabelas: ["v1-eventos_acoes"]}

  - id: "cvm_2023_2025"
    texto: "CVM de 2023 e jan a jul/2025"
    detalhe: "Documentos da CVM nesses anos (o diagnóstico mostra por ano, não por mês)"
    prioridade: "normal"
    checagem: "origem_nos_anos"
    parametros: {origem: "cvm_ipe", anos: [2023, 2025]}

  - id: "emissores_jbs_natura"
    texto: "JBS e Natura com histórico completo"
    detalhe: "Tabela de emissores por período"
    prioridade: "normal"
    checagem: "emissores_por_periodo"
    parametros: {tickers: ["JBSS32", "NATU3"]}

  - id: "hapvida_ifrs17"
    texto: "Receita da Hapvida (IFRS 17)"
    detalhe: "situacao = ajuste_ifrs17"
    prioridade: "normal"
    checagem: "valor_distinto"
    parametros: {tabela: "v1-balancos", coluna: "situacao", valor: "ajuste_ifrs17"}

  - id: "juiza_historico"
    texto: "Juíza nas 1.343 notícias que ficaram para trás"
    detalhe: "Fica entregue quando os nulos de papel em v1-noticias caírem abaixo de 0,1%"
    prioridade: "normal"
    checagem: "coluna_preenchida"
    parametros: {tabela: "v1-noticias", coluna: "papel", max_pct_nulo: 0.1, estrito: true}

  - id: "indices_completos"
    texto: "IDIV, IFIX e SMLL completos"
    detalhe: "Desde 30/12/2019"
    prioridade: "normal"
    checagem: "indices_desde"
    parametros: {indices: ["IDIV", "IFIX", "SMLL"], inicio_ate: "2019-12-30"}

  - id: "raiz4_raiz55"
    texto: "RAIZ4 virou RAIZ55 em 03/11/2026 (cotação por lote de 100; Ofício Circular B3 022/2026-VPE)"
    detalhe: "Some a divergência other_codes da RAIZ4 e v1-mudancas_ticker passa a ter RAIZ4 → RAIZ55"
    prioridade: "normal"
    checagem: "divergencia_e_mudanca"
    parametros: {tema: "other_codes", termo: "RAIZ4", antigo: "RAIZ4", novo: "RAIZ55"}

  - id: "ebitda_balancos"
    texto: "D&A completa nos balanços das não financeiras"
    detalhe: "A coleta completou depreciacao_amortizacao (sem coluna ebitda). Pedido: D&A da NATU3 (holding, CNPJ 32785497000197) no 3T24. Exceções explicadas pela coleta: GMAT3 1T20–3T21, AURE3 1T21–2T22, BRAV3 2T20, TIMS3 2T22, SBSP3 3T23, BRAP4 em todos (holding sem D&A). SRNA3 fica fora (tickers_excluidos)"
    prioridade: "normal"
    checagem: "da_nao_financeiras"
    parametros:
      excecoes:
        - {ticker: "GMAT3", de: "1T20", ate: "3T21"}
        - {ticker: "AURE3", de: "1T21", ate: "2T22"}
        - {ticker: "BRAV3", de: "2T20", ate: "2T20"}
        - {ticker: "TIMS3", de: "2T22", ate: "2T22"}
        - {ticker: "SBSP3", de: "3T23", ate: "3T23"}
        - {ticker: "BRAP4"}   # sem de/ate = todos os trimestres (holding sem D&A, confirmado pela coleta em 09/11/2026)

  # Pedidos de 04/11/2026: indicadores "indisponível" no resumo_acao por falta de dado da coleta.
  # Sem checagem automática: o diagnóstico não traz esses campos por empresa (conferência manual).
  - id: "balanco_bancos_seguradoras"
    texto: "Lucro e PL de bancos e seguradoras"
    detalhe: "BBAS3 e BBDC3/BBDC4 sem lucro_liquido e patrimonio_liquido em todos os balanços (plano de contas de instituição financeira); BBSE3 e IRBR3 sem lucro_liquido (rótulo do lucro das seguradoras)"
    prioridade: "normal"

  - id: "dfp_2025_santander"
    texto: "DFP 2025 do Santander (SANB11)"
    detalhe: "Linhas da DFP de 31/12/2025 com todas as contas nulas; os ITRs de 2026 vieram"
    prioridade: "normal"

  - id: "balancos_assai"
    texto: "Balanços do Assaí (ASAI3) desde o 4T21"
    detalhe: "Só há balanços até 30/09/2021; o CNPJ está em cnpjs_sem_balanco"
    prioridade: "normal"

  - id: "balancos_bradespar"
    texto: "Balanços da Bradespar (BRAP4) desde 2024"
    detalhe: "Último balanço é a DFP de 31/12/2023; indicadores caem pela regra de balanço antigo"
    prioridade: "normal"

  - id: "balancos_tim"
    texto: "Balanços da TIM (TIMS3) de 2024 e 2025"
    detalhe: "Trimestres de 2024 e DFP de 31/12/2025 com lucro e PL zerados; derruba as medianas do setor da VIVT3"
    prioridade: "normal"

  - id: "emprestimos_zerados"
    texto: "Confirmar empréstimos zerados de Allos, Odontoprev e Locaweb"
    detalhe: "ALOS3, SAUD3 e LWSA3 com empréstimos de curto e longo prazo = 0: confirmar se é real ou falta de dado (ex.: debêntures)"
    prioridade: "normal"

  - id: "proventos_bdr_jbs"
    texto: "Proventos e razão BDR/ação da JBS (JBSS32)"
    detalhe: "Opcional: hoje P/L, P/VP, DY, payout e proventos do BDR ficam indisponíveis (regra D9)"
    prioridade: "normal"
