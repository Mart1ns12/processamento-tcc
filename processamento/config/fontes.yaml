# Mapa banco da coleta -> contrato (ESPECIFICACAO.md, seção 3).
# chave/colunas usam o NOME DO CONTRATO; o valor de cada coluna é o nome REAL no banco.
# Se a coleta renomear algo, muda só este arquivo.
versao: 1
tabelas:
  noticias:
    nome_real: v1-noticias
    chave: [id, ticker]
    colunas: {id: id, ticker: ticker, data_hora_publicacao: data_hora_publicacao, data_hora_coleta: data_hora_coleta, titulo: titulo, fonte: fonte, link: link, prob_positivo: prob_positivo, prob_neutro: prob_neutro, prob_negativo: prob_negativo, origem: origem, papel: papel, tipo_conteudo: tipo_conteudo, evento: evento, qualidade: qualidade, data_publicacao: data_publicacao}
    colunas_ignoradas: [momento_pregao]   # existe no banco; NÃO usar (seção 3.1)
    textos_vazios_nota: [titulo]   # texto vazio no título vira nota com até 10 ids (a leitura já trata como vazio); nas outras colunas é divergência
    coluna_data: data_publicacao
    coluna_entidade: ticker
    # Mecanismo para fontes futuras: origens aceitas na leitura mas descartadas logo depois.
    # Aviso no execucao.json e nota no diagnóstico. Lista vazia = todas entram.
    origens_ignoradas: []
    # Origens em que 00:00:00 de Los Angeles significa "só data" (regra N1-A, fontes.aplicar_regra_so_data).
    origens_so_data: [google_news]
    # Papéis da juíza descartados na leitura, antes das repetidas (dataset, rotina e noticias_dia; decisão de 01/11/2026).
    # Notícia sem julgamento (papel vazio) fica. Contagem em df.attrs["papeis_ignorados"].
    papeis_ignorados: [errada]
    valores_permitidos:
      origem: [google_news, cvm_ipe, wordpress]
      papel: [protagonista, citada_com_fato, mencao, errada, matriz_estrangeira]
      tipo_conteudo: [reportagem, opiniao, lista, agenda, resumo_mercado, podcast_video, newsletter, patrocinado, outro]
      evento: [resultado, dividendo_jcp, fato_relevante, fusao_aquisicao, guidance, recomendacao, regulatorio, operacional, governanca, juridico, mudanca_ticker, macro, outro]
  precos:
    nome_real: v1-precos
    chave: [data, ticker]
    colunas: {data: data, ticker: ticker, abertura: abertura, maxima: maxima, minima: minima, fechamento: fechamento, fechamento_ajustado: fechamento_ajustado, volume: volume}
    coluna_data: data
    coluna_entidade: ticker
    zero_proibido: [volume]
  cadastro:
    nome_real: v1-cadastro
    chave: [ticker]
    colunas: {ticker: ticker, cnpj: cnpj, empresa: empresa, setor: setor, subsetor: subsetor, tipo_acao: tipo_acao, unit_qtd_on: unit_qtd_on, unit_qtd_pn: unit_qtd_pn}
    coluna_data: null
    coluna_entidade: ticker
    valores_permitidos:
      tipo_acao: ["ON", "PN", "UNIT", "BDR"]   # aspas: sem elas o YAML lê ON como booleano
  mudancas_ticker:
    nome_real: v1-mudancas_ticker
    chave: [ticker_antigo]
    colunas: {ticker_antigo: ticker_antigo, ticker_novo: ticker_novo, data_mudanca: data_mudanca}
    coluna_data: data_mudanca
    coluna_entidade: ticker_antigo
    colunas_nota_preenchimento: [data_mudanca]   # preenchida desde 24/10/2026: só nota com a contagem (seção 3.1)
  balancos:
    nome_real: v1-balancos
    chave: [cnpj, tipo_documento, data_inicio_periodo, data_fim_periodo]
    colunas: {cnpj: cnpj, tipo_documento: tipo_documento, data_inicio_periodo: data_inicio_periodo, data_fim_periodo: data_fim_periodo, data_entrega: data_entrega, receita_liquida: receita_liquida, lucro_bruto: lucro_bruto, lucro_liquido: lucro_liquido, patrimonio_liquido: patrimonio_liquido, ebit: ebit, depreciacao_amortizacao: depreciacao_amortizacao, emprestimos_curto_prazo: emprestimos_curto_prazo, emprestimos_longo_prazo: emprestimos_longo_prazo, caixa: caixa, aplicacoes_financeiras: aplicacoes_financeiras}
    coluna_data: data_fim_periodo
    coluna_entidade: cnpj
    valores_permitidos:
      tipo_documento: [DFP, ITR]
    # ebit, D&A, empréstimos, caixa e aplicações: parciais desde 22/10/2026 (como lucro_bruto);
    # sem lista de vazias conhecidas, a regra geral só acusa se voltarem a ficar 100% vazias
  acoes_emitidas:
    nome_real: v1-acoes_emitidas
    chave: [cnpj, data_referencia]
    colunas: {cnpj: cnpj, data_referencia: data_referencia, qtd_on: qtd_on, qtd_pn: qtd_pn}
    coluna_data: data_referencia
    coluna_entidade: cnpj
  proventos:
    nome_real: v1-proventos
    chave: [ticker, tipo, data_com]
    colunas: {ticker: ticker, tipo: tipo, data_com: data_com, valor_por_acao: valor_por_acao, data_pagamento: data_pagamento}
    coluna_data: data_com
    coluna_entidade: ticker
    valores_permitidos:
      tipo: [DIVIDENDO, JCP]
  indices:
    nome_real: v1-indices
    chave: [data, indice]
    colunas: {data: data, indice: indice, valor: valor}
    coluna_data: data
    coluna_entidade: indice
    valores_permitidos:
      indice: [CDI, IPCA, IDIV, SMLL, IFIX]
auxiliares:
  raw_articles:
    nome_real: raw_articles
    colunas: {id: id, lang: lang, published_at: published_at, published_precision: published_precision, origem: origem, resolved_url: resolved_url}
  sentimento_artigos:
    nome_real: staging_article_sentiment
    colunas: {article_id: article_id, model: model, text_source: text_source}
  painel_execucoes:
    nome_real: v1-painel_execucoes
    colunas: {id: id, tipo: tipo, status: status, aguardando: aguardando, iniciada_em: iniciada_em, finalizada_em: finalizada_em, origem: origem}
  painel_etapas:
    nome_real: v1-painel_etapas
    colunas: {execucao_id: execucao_id, etapa_id: etapa_id, ordem: ordem, status: status, iniciada_em: iniciada_em, finalizada_em: finalizada_em}
  composicao_ibov:            # criada pela coleta em 23/10/2026 (seção 3.5); vigencia_fim vazia = ainda vigente
    nome_real: v1-composicao_ibov
    opcional: true
    formato: intervalos        # intervalos | fotos (colunas data_carteira, ticker) | cadastro
    colunas: {ticker: ticker, data_inicio: vigencia_inicio, data_fim: vigencia_fim, participacao: participacao, fonte: fonte}
  raw_b3_cadastro:            # códigos de negociação atuais por empresa (other_codes = lista JSON de tickers)
    nome_real: v1-raw_b3_cadastro
    colunas: {cnpj: cnpj, issuing_company: issuing_company, other_codes: other_codes}
